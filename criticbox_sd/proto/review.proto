syntax = "proto3";

package review;

service ReviewService {
  rpc CreateReview (CreateReviewRequest) returns (ReviewResponse);
  rpc GetMovieStats (MovieStatsRequest) returns (MovieStatsResponse);
  rpc GetBatchMovieStats (BatchMovieStatsRequest) returns (BatchMovieStatsResponse);
  rpc GetAllReviews (GetAllReviewsRequest) returns (GetAllReviewsResponse);
  rpc GetReviewsByMovie (MovieReviewsRequest) returns (GetAllReviewsResponse);
  rpc GetReviewsByUser (UserReviewsRequest) returns (GetAllReviewsResponse);
}


message CreateReviewRequest {
  int32 tmdb_id = 1;
  string user_id = 2;
  float rating = 3;
  string comment = 4;
  bool contains_spoilers = 5;
  string media_type = 6;
  int32 season_number = 7;
  int32 episode_number = 8;
  string movie_title = 9;
  string poster_url = 10;
}

message ReviewResponse {
  string review_id = 1;
  int32 tmdb_id = 2;
  string user_id = 3;
  float rating = 4;
  string comment = 5;
  bool contains_spoilers = 6;
  string created_at = 7;
  bool success = 8;
  string message = 9;
  string media_type = 10;
  int32 season_number = 11;
  int32 episode_number = 12;
  string movie_title = 13;
  string poster_url = 14;
}

message MovieStatsRequest {
  int32 tmdb_id = 1;
}

message MovieStatsResponse {
  int32 tmdb_id = 1;
  float average_rating = 2;
  int32 total_count = 3;
}

message BatchMovieStatsRequest {
  repeated int32 tmdb_ids = 1;
}

message BatchMovieStatsResponse {
  map<int32, MovieStatsResponse> stats = 1;
}

message GetAllReviewsRequest {
  int32 limit = 1;
}

message MovieReviewsRequest {
  int32 tmdb_id = 1;
}

message UserReviewsRequest {
  string user_id = 1;
}

message ReviewItem {
  string review_id = 1;
  int32 tmdb_id = 2;
  string movie_title = 3;
  string user_id = 4;
  float rating = 5;
  string comment = 6;
  bool contains_spoilers = 7;
  string created_at = 8;
  string media_type = 9;
  int32 season_number = 10;
  int32 episode_number = 11;
  string poster_url = 12;
}

message GetAllReviewsResponse {
  repeated ReviewItem reviews = 1;
  int32 total_count = 2;
}

